# Banco só para testes (npm run db:teste:up). Sem volume: zerar é derrubar e subir.
services:
  db-teste:
    image: postgres:17-alpine
    container_name: financeiro-db-teste
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: financeiro_teste
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d financeiro_teste"]
      interval: 2s
      timeout: 3s
      retries: 30
